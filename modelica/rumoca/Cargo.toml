[workspace]

[package]
name = "run42-rumoca-host"
version = "0.1.0"
edition = "2021"
rust-version = "1.100"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rumoca = { git = "https://github.com/CogniPilot/rumoca.git", rev = "9c8c56fcd9f5ab9beb871f09bf5d9eed82971c54", default-features = false }
rumoca-core = { git = "https://github.com/CogniPilot/rumoca.git", rev = "9c8c56fcd9f5ab9beb871f09bf5d9eed82971c54" }
rumoca-sim = { git = "https://github.com/CogniPilot/rumoca.git", rev = "9c8c56fcd9f5ab9beb871f09bf5d9eed82971c54", default-features = false, features = ["native-solvers"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[patch.crates-io]
diffsol = { git = "https://github.com/CogniPilot/rumoca.git", rev = "9c8c56fcd9f5ab9beb871f09bf5d9eed82971c54" }
